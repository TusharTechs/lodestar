<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodestar · Bankable mini-grid demand</title>
<meta name="description" content="Demand forecasts with P90/P50/P10 ranges, growth curves and lender stress tests for any unelectrified village, built on open data and validated against metered mini-grids.">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css?v=10" rel="stylesheet">
</head>
<body>
<header class="top">
  <div class="brand"><img src="img/logo.svg" class="logo" alt="" width="28" height="28"> Lodestar <span class="tag">Bankable demand for mini-grids</span></div>
  <nav id="tabs">
    <button data-tab="explore" class="on">Explore</button>
    <button data-tab="validation">Validation</button>
    <button data-tab="impact">Impact</button>
    <button data-tab="portfolio">Portfolio &amp; SMS</button>
    <button data-tab="bureau">Demand Bureau</button>
    <button data-tab="ledger">Track record</button>
    <button data-tab="method">Method</button>
  </nav>
</header>

<section id="explore" class="tab on">
  <div class="mapcol">
    <div id="map"></div>
    <div class="sitelist" id="sitelist"></div>
    <div class="maptip">Click anywhere on the map to forecast a new location</div>
    <div class="maplegend"><span><i style="background:#48cae4"></i>dwelling</span><span><i style="background:#ffb703"></i>large building</span><span><i style="background:#e63946"></i>mill</span><span><i style="background:#d9a441"></i>market</span><span><i style="background:#8e7cc3"></i>school</span><span><i style="background:#2a9d8f"></i>clinic</span></div>
  </div>
  <div class="reportcol" id="report">
    <div class="landing" id="landing"></div>
  </div>
</section>

<section id="validation" class="tab"><div class="page" id="valpage"></div></section>
<section id="impact" class="tab"><div class="page" id="impactpage"></div></section>
<section id="portfolio" class="tab"><div class="page" id="portfoliopage"></div></section>
<section id="bureau" class="tab"><div class="page" id="bureaupage"></div></section>
<section id="ledger" class="tab"><div class="page" id="ledgerpage"></div></section>
<section id="method" class="tab"><div class="page" id="methodpage"></div></section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js?v=10"></script>
</body>
</html>
