# The free Render instance sleeps after 15 idle minutes and takes about a minute to wake.
# A light ping every 10 minutes keeps the demo responsive for reviewers.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://lodestar-utfz.onrender.com/healthz
